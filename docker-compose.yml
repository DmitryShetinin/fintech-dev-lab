services:

  candidate-service:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=payments;
        Username=postgres;
        Password=postgres

      PROVIDER_URL: http://provider-simulator:8081

    depends_on:
      postgres:
        condition: service_healthy
      provider-simulator:
        condition: service_started


  postgres:
    image: postgres:16

    ports:
      - "5432:5432"


    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d payments"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0

    environment:
      CALLBACK_URL: http://candidate-service:8080/receipts

    ports:
      - "8081:8081"


volumes:
  postgres-data: