name: CI

on:
  push:
    branches:
      - "**"

  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore fintech-dev-lab.slnx

      - name: Build
        run: dotnet build fintech-dev-lab.slnx --no-restore --configuration Release

      - name: Apply migrations
        run: dotnet ef database update --project src/Infrastructure --startup-project src/fintech-dev-lab

      - name: Test
        run: dotnet test src/Tests/IntegrationTests/IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=detailed"